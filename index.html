<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>const VIDEO_URL = "";</script>
<style>
:root{
  --bg1:#0A0157; --bg2:#050221; --panel:#1A0941; --panel2:#0A0157;
  --purple:#CC47E7; --blue:#2E9BFF; --green:#86E30F; --yellow:#F8C00B;
  --cyan:#44C8EE; --red:#EA4F40; --violet:#5D00F8; --gold:#F8C00B;
  --white:#fff; --soft:#D9D2FF;
  --title: clamp(1.5rem, 4.2vw, 3.2rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Exo 2",system-ui,Segoe UI,Arial,sans-serif;color:var(--white);
  background:radial-gradient(ellipse at 50% 40%,var(--bg1) 0%,#07013C 45%,var(--bg2) 100%) fixed;
  overflow:hidden;
}
/* circuitos decorativos */
.circuit{position:fixed;width:min(36vw,340px);opacity:.55;pointer-events:none;z-index:0}
.circuit.tl{top:8px;left:0}.circuit.tr{top:8px;right:0;transform:scaleX(-1)}
.circuit.bl{bottom:8px;left:0;transform:scaleY(-1)}.circuit.br{bottom:8px;right:0;transform:scale(-1,-1)}

/* ---------- estructura ---------- */
#deck{position:relative;z-index:1;height:100%;width:100%}
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:clamp(56px,8vh,90px) clamp(16px,4vw,64px) clamp(84px,12vh,110px);
  opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .45s,transform .45s,visibility .45s;
  overflow-y:auto;
}
.slide.active{opacity:1;visibility:visible;transform:none}
.slide.prev{transform:translateX(-40px)}
.slide-inner{width:100%;max-width:1150px;margin:auto 0;display:flex;flex-direction:column;gap:clamp(14px,3vh,30px)}

h1.t,h2.t{
  font-weight:900;font-style:italic;text-transform:uppercase;text-align:center;letter-spacing:.5px;
  font-size:var(--title);line-height:1.08;
  text-shadow:0 0 8px rgba(68,200,238,.85),0 0 22px rgba(68,200,238,.45);
}
.tag{
  position:absolute;top:14px;left:16px;font-size:.78rem;font-weight:800;letter-spacing:1px;
  padding:5px 14px;border-radius:999px;border:1.5px solid var(--cyan);color:var(--cyan);background:rgba(26,9,65,.8);
  box-shadow:0 0 10px rgba(68,200,238,.5);
}

/* tarjeta neón */
.card{
  --c:var(--cyan);background:var(--panel);border:2.5px solid var(--c);border-radius:18px;
  box-shadow:0 0 12px var(--c),0 0 26px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 18%,transparent);
  padding:clamp(14px,2.2vw,24px);position:relative;
}
.c-purple{--c:var(--purple)}.c-blue{--c:var(--blue)}.c-green{--c:var(--green)}.c-yellow{--c:var(--yellow)}
.c-cyan{--c:var(--cyan)}.c-red{--c:var(--red)}.c-gold{--c:#B5835A}

.icon{
  width:clamp(58px,7vw,84px);height:clamp(58px,7vw,84px);border-radius:50%;display:grid;place-items:center;
  font-size:clamp(1.7rem,3vw,2.4rem);margin:0 auto;background:var(--panel2);
  border:2.5px solid var(--c);box-shadow:0 0 14px var(--c);
}

/* concepto */
.concept{display:grid;grid-template-columns:minmax(170px,240px) 1fr;gap:clamp(16px,3vw,40px);align-items:stretch}
.concept .side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}
.side b{font-size:1.15rem;font-weight:800;letter-spacing:.5px}
.side small{color:var(--soft);font-size:.9rem}
ul.neon{list-style:none;display:flex;flex-direction:column;gap:16px;justify-content:center;font-size:clamp(1.05rem,1.9vw,1.4rem);line-height:1.4}
ul.neon li{padding-left:30px;position:relative;opacity:0;transform:translateY(10px);transition:.5s}
ul.neon li::before{content:"▸";position:absolute;left:0;color:var(--cyan);text-shadow:0 0 8px var(--cyan)}
.active ul.neon li{opacity:1;transform:none}
.active ul.neon li:nth-child(2){transition-delay:.15s}.active ul.neon li:nth-child(3){transition-delay:.3s}.active ul.neon li:nth-child(4){transition-delay:.45s}

/* tarjetas */
.cards{display:grid;gap:clamp(12px,2vw,24px);grid-template-columns:repeat(var(--n),1fr)}
.flip{perspective:900px;cursor:pointer;min-height:clamp(220px,40vh,320px)}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face h3{color:var(--c);font-weight:800;font-size:clamp(1rem,1.7vw,1.3rem);text-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
.face p{font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.35}
.face .hint{font-size:.78rem;color:var(--soft);opacity:.8}
.flip{transition:transform .25s}.flip:hover{transform:translateY(-4px)}
.card{transition:transform .25s}

/* dos columnas */
.twocol{display:grid;grid-template-columns:minmax(150px,200px) 1fr 1fr;gap:clamp(12px,2vw,24px)}
.twocol h3{color:var(--c);font-weight:800;font-size:clamp(1.1rem,1.8vw,1.4rem);margin-bottom:10px}
.twocol p{font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.45;margin-bottom:8px}
.twocol ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:clamp(1rem,1.5vw,1.15rem)}
.twocol ul li::before{content:"▸ ";color:var(--c)}

/* reto */
.reto{display:grid;grid-template-columns:1fr auto;gap:clamp(14px,3vw,36px);align-items:stretch}
.reto .card{background:#1A0941}
.pill{display:inline-block;background:#fff;color:#C62828;font-weight:800;padding:4px 18px;border-radius:6px;margin:0 auto 14px}
.reto .q{font-weight:900;font-style:italic;text-transform:uppercase;text-align:center;color:var(--red);
  font-size:clamp(1.15rem,2.6vw,2rem);line-height:1.2;text-shadow:0 0 10px rgba(234,79,64,.55)}
.reto .box{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.timer{position:relative;width:clamp(130px,16vw,180px);aspect-ratio:1}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-style:italic;font-size:clamp(2.2rem,4vw,3.2rem)}
.timer .num{line-height:1}.timer .num small{display:block;font-size:.8rem;font-style:italic;margin-top:4px}
.timer.done .num{color:var(--red);animation:pulse .5s 4}
@keyframes pulse{50%{transform:scale(1.15)}}
.answer{margin-top:16px;font-size:clamp(1.05rem,2vw,1.4rem);font-weight:800;color:var(--green);text-shadow:0 0 10px var(--green);
  max-height:0;overflow:hidden;opacity:0;transition:.5s}
.answer.show{max-height:200px;opacity:1}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}

button.btn{
  font-family:inherit;font-weight:800;font-size:.95rem;cursor:pointer;color:#050221;border:none;border-radius:10px;
  padding:10px 16px;background:var(--b,var(--cyan));box-shadow:0 0 12px var(--b,var(--cyan));transition:transform .15s,filter .15s;
}
button.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
button.btn.ghost{background:transparent;color:var(--b,var(--cyan));border:2px solid var(--b,var(--cyan))}
.award{font-size:.85rem;padding:7px 12px}

/* ruleta */
.wheel-wrap{display:grid;grid-template-columns:minmax(260px,430px) 1fr;gap:clamp(16px,3vw,40px);align-items:center}
.wheel{position:relative;width:100%;aspect-ratio:1;max-width:430px;margin:0 auto}
.wheel svg{width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(68,200,238,.45))}
.wheel .rot{transition:transform 4.5s cubic-bezier(.12,.75,.12,1);transform-origin:200px 200px}
.wheel .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 0 8px var(--gold));z-index:2}
.wheel .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;
  background:#050221;border:4px solid var(--gold);box-shadow:0 0 18px var(--gold);color:var(--gold);font-weight:900;
  display:grid;place-items:center;font-size:clamp(.9rem,1.8vw,1.3rem);cursor:pointer;font-family:inherit}
.wheel .hub:hover{transform:translate(-50%,-50%) scale(1.06)}
.result{font-size:clamp(1rem,1.8vw,1.25rem);line-height:1.4}
.result h3{font-size:clamp(1.2rem,2.2vw,1.6rem);font-weight:800;margin-bottom:12px;text-align:center}

/* video */
.video-frame{width:100%;max-width:900px;margin:0 auto;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  border:3px solid var(--gold);box-shadow:0 0 18px var(--gold),0 0 40px rgba(248,192,11,.35);background:#0B0230;display:grid;place-items:center}
.video-frame iframe{width:100%;height:100%;border:0}
.vid-empty{text-align:center;padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.play{width:80px;height:80px;border-radius:50%;background:#D32F2F;display:grid;place-items:center;font-size:2rem;box-shadow:0 0 18px #D32F2F}
.vid-empty input{width:min(520px,80vw);padding:12px;border-radius:10px;border:2px solid var(--cyan);background:#050221;color:#fff;font-family:inherit;font-size:1rem}

/* menú */
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,2vw,22px)}
.menu .card{display:flex;align-items:center;gap:16px;cursor:pointer;padding:14px 18px}
.menu .card:hover{transform:translateY(-3px) scale(1.01)}
.menu .n{flex:none;width:52px;height:52px;border-radius:10px;background:var(--c);color:#050221;font-weight:900;font-size:1.6rem;display:grid;place-items:center}
.menu b{font-style:italic;font-size:clamp(1rem,1.6vw,1.2rem)}
.menu small{display:block;color:var(--soft);font-size:.9rem;margin-top:3px}

/* portada */
.cover{text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.cover h1{font-size:clamp(2.2rem,7vw,5rem);text-shadow:0 0 10px #ff3dcb,0 0 30px rgba(255,61,203,.5)}
.cover p{color:var(--cyan);font-style:italic;font-size:clamp(1rem,2vw,1.4rem)}
.start{font-size:1.3rem!important;padding:16px 34px!important;--b:var(--gold)}

/* tabla puntos */
.score table{width:100%;border-collapse:collapse;font-size:clamp(1rem,1.7vw,1.25rem)}
.score th{background:var(--blue);color:#fff;padding:10px}
.score td{padding:10px;border-bottom:1px solid rgba(68,200,238,.35);text-align:center}
.score td input{background:transparent;border:none;color:#fff;font:inherit;font-weight:800;width:100%;text-align:left}
.bar{height:14px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .5s}
.winner{text-align:center;font-size:clamp(4rem,10vw,7rem);filter:drop-shadow(0 0 20px var(--gold))}
.winner-name{display:inline-block;margin-top:10px;padding:12px 40px;border-radius:14px;background:#7B2CBF;border:3px solid var(--gold);
  box-shadow:0 0 20px var(--gold);color:var(--gold);font-weight:900;font-style:italic;font-size:clamp(1.4rem,3vw,2.2rem)}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;justify-content:center;
  padding:10px 14px;background:linear-gradient(transparent,rgba(5,2,33,.95) 40%)}
.nav button{font-family:inherit;background:var(--panel);color:var(--cyan);border:2px solid var(--cyan);border-radius:10px;
  min-width:44px;height:42px;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:0 0 8px rgba(68,200,238,.5);padding:0 12px}
.nav button:hover{background:var(--cyan);color:#050221}
.nav .count{min-width:70px;text-align:center;font-weight:800;color:var(--soft)}
.progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--green));z-index:6;transition:width .4s;box-shadow:0 0 10px var(--cyan)}

/* panel de puntos y notas */
.drawer{position:fixed;right:12px;bottom:66px;z-index:7;width:min(320px,92vw);display:none}
.drawer.open{display:block}
.drawer h4{text-align:center;font-weight:900;font-style:italic;margin-bottom:10px;color:var(--gold)}
.team{display:flex;align-items:center;gap:8px;margin:7px 0}
.team input{flex:1;min-width:0;background:#050221;border:1.5px solid var(--cyan);border-radius:8px;color:#fff;padding:6px 8px;font-family:inherit;font-weight:700}
.team span{width:44px;text-align:center;font-weight:900;font-size:1.15rem}
.team button{width:32px;height:32px;border-radius:8px;border:none;font-weight:900;cursor:pointer;font-size:1rem}
.notes{position:fixed;left:12px;bottom:66px;z-index:7;width:min(460px,92vw);max-height:45vh;overflow:auto;display:none;font-size:1rem;line-height:1.45}
.notes.open{display:block}
.notes h4{color:var(--cyan);margin-bottom:6px}

.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-80px);z-index:9;background:var(--green);color:#050221;font-weight:900;
  padding:10px 22px;border-radius:12px;box-shadow:0 0 18px var(--green);transition:transform .35s}
.toast.show{transform:translate(-50%,0)}

.ic{display:inline-flex;vertical-align:-0.15em}.ic svg{width:1em;height:1em}
.icon .ic{font-size:clamp(1.7rem,3vw,2.3rem);color:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.nav .ic{font-size:1.15rem;vertical-align:-0.2em}
.menu .n .ic{font-size:1.5rem}.winner .ic{font-size:clamp(4rem,10vw,7rem);color:var(--gold)}
.play .ic{font-size:2rem;color:#fff}.team button .ic{font-size:1rem}
.concept.has-img{grid-template-columns:minmax(150px,210px) 1.25fr 1fr}
.photo{border-radius:18px;overflow:hidden;border:2.5px solid var(--c,var(--cyan));box-shadow:0 0 14px var(--c,var(--cyan));min-height:200px;background:#050221}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.cards.has-img{grid-template-columns:repeat(var(--n),1fr) 1.3fr}
.cover .logo{background:#fff;border-radius:14px;padding:10px 18px;box-shadow:0 0 18px rgba(255,255,255,.35)}
.cover .logo img{height:clamp(46px,7vw,70px);display:block}
.people{display:grid;grid-template-columns:repeat(2,auto);gap:6px 28px;font-weight:700;font-size:clamp(.95rem,1.6vw,1.15rem);justify-content:center}
.people-card{padding:16px 26px}.people-card b{display:block;text-align:center;color:var(--cyan);font-style:italic;margin-bottom:8px}
@media (max-width:860px){.concept.has-img,.cards.has-img{grid-template-columns:1fr}.cards.has-img{grid-template-columns:repeat(2,1fr)}.cards.has-img .photo{grid-column:1/-1}.people{grid-template-columns:1fr}}

.quiz{display:flex;flex-direction:column;gap:clamp(12px,2vh,20px);width:100%}
.quiz .q{font-style:normal;text-transform:none;font-size:clamp(1.2rem,2.1vw,2.1rem)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,18px)}
.opt{font-family:inherit;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;color:#fff;font-weight:700;
  font-size:clamp(1rem,1.6vw,1.45rem);padding:clamp(12px,2vh,20px) 16px;border-radius:14px;background:#0A0157;border:2.5px solid var(--cyan);
  box-shadow:0 0 10px rgba(68,200,238,.4);transition:transform .15s,background .2s}
.opt:hover{transform:translateY(-3px);background:#14087a}
.opt .L{flex:none;width:2.1em;height:2.1em;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#050221;font-weight:900}
.opt.ok{border-color:var(--green);background:rgba(134,227,15,.22);box-shadow:0 0 18px var(--green)}.opt.ok .L{background:var(--green)}
.opt.bad{border-color:var(--red);background:rgba(234,79,64,.25);box-shadow:0 0 18px var(--red);animation:shake .4s}.opt.bad .L{background:var(--red)}
.opt.off{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.aw{text-align:center;color:var(--soft);font-weight:700;margin-top:4px}
.award-wrap .row{margin-top:6px}
.result .quiz .q{font-size:clamp(1.05rem,1.6vw,1.5rem);font-weight:800;color:#fff;text-align:left}
.result .opts{grid-template-columns:1fr}
.result .opt{font-size:clamp(.95rem,1.3vw,1.2rem);padding:10px 14px}
/* ocupar toda la pantalla */
.slide{padding:clamp(52px,7vh,80px) clamp(14px,3vw,48px) clamp(78px,11vh,100px)}
.slide-inner{max-width:1680px;flex:1;justify-content:center;margin:0}
.concept,.twocol{min-height:min(58vh,640px)}
.concept.has-img{grid-template-columns:minmax(170px,.75fr) 1.6fr 1.5fr}
.twocol{grid-template-columns:minmax(170px,.75fr) 1.5fr 1.5fr}
ul.neon{font-size:clamp(1.1rem,1.75vw,1.9rem);gap:clamp(14px,2.4vh,26px)}
.twocol h3{font-size:clamp(1.2rem,2vw,2rem)}.twocol p,.twocol ul{font-size:clamp(1.05rem,1.6vw,1.6rem)}
.flip{min-height:min(52vh,560px)}
.face h3{font-size:clamp(1.05rem,1.9vw,1.9rem)}.face p{font-size:clamp(1rem,1.8vw,1.7rem)}
.icon{width:clamp(64px,8vw,120px);height:clamp(64px,8vw,120px)}.icon .ic{font-size:clamp(1.8rem,3.6vw,3.4rem)}
.side b{font-size:clamp(1.1rem,1.6vw,1.6rem)}
.reto{grid-template-columns:1fr minmax(200px,.32fr);min-height:min(60vh,660px)}
.side-timer .timer{width:clamp(150px,17vw,260px)}
.wheel-wrap{grid-template-columns:minmax(280px,1fr) 1.2fr}.wheel{max-width:min(560px,58vh)}
.result{font-size:clamp(1.05rem,1.6vw,1.6rem)}
.menu{gap:clamp(12px,2.2vh,26px)}.menu .card{padding:clamp(14px,2.4vh,26px) 22px}.menu b{font-size:clamp(1.05rem,1.8vw,1.7rem)}.menu small{font-size:clamp(.9rem,1.2vw,1.2rem)}
.video-frame{max-width:min(1400px,calc(62vh*16/9))}
.score{width:100%}.score table{font-size:clamp(1.05rem,1.9vw,1.8rem)}
@media (max-width:860px){.opts{grid-template-columns:1fr}.reto,.concept,.twocol,.wheel-wrap{min-height:0;grid-template-columns:1fr}.concept.has-img{grid-template-columns:1fr}.flip{min-height:200px}}
.yt-thumb{position:relative;display:block;width:100%;height:100%}.yt-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt-thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px}
a.btn{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#050221;border-radius:10px;padding:10px 16px;background:var(--b);box-shadow:0 0 12px var(--b)}
.cover h1{font-size:clamp(2.4rem,7vw,6.5rem)}.cover p{font-size:clamp(1.05rem,2vw,1.9rem)}
.people{font-size:clamp(1rem,1.7vw,1.7rem);gap:8px 40px}.people-card{padding:clamp(16px,2.5vh,28px) clamp(24px,3vw,48px)}
.cover .logo img{height:clamp(50px,9vh,96px)}.start{font-size:clamp(1.2rem,1.8vw,1.7rem)!important}

/* ===== portada ===== */
.hero{display:grid!important;grid-template-columns:1.15fr 1fr;align-items:center;gap:clamp(20px,4vw,70px)}
.hero-txt{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(10px,2vh,22px)}
.hero .logo{background:#fff;border-radius:14px;padding:8px 18px;box-shadow:0 0 22px rgba(255,255,255,.35)}
.hero .logo img{height:clamp(44px,8vh,84px);display:block}
.kicker{font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:clamp(.75rem,1.1vw,1.05rem);color:var(--cyan);
  border:1.5px solid var(--cyan);border-radius:999px;padding:6px 16px;box-shadow:0 0 12px rgba(68,200,238,.45)}

@page{size:16in 9in;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:radial-gradient(ellipse at 50% 40%,#0A0157 0%,#07013C 45%,#050221 100%)!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .nav,.progress,.toast,.row,.side-timer .btn,.hub,.cw-hub{display:none!important}
  #deck{height:auto}
  .slide{position:relative!important;inset:auto;opacity:1!important;visibility:visible!important;transform:none!important;transition:none!important;
    width:16in;height:9in;overflow:hidden;page-break-after:always;break-after:page;
    background:radial-gradient(ellipse at 50% 40%,#0A0157 0%,#07013C 45%,#050221 100%)}
  .slide *{animation:none!important;transition:none!important}
  ul.neon li,.person{opacity:1!important;transform:none!important}

}

/* ===== efectos llamativos ===== */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.55;filter:blur(60px);
  background:radial-gradient(circle at 20% 30%,rgba(204,71,231,.35),transparent 40%),radial-gradient(circle at 80% 70%,rgba(68,200,238,.3),transparent 42%),

@keyframes aurora{50%{transform:translate(4%,-3%) rotate(8deg) scale(1.08)}100%{transform:translate(-4%,3%) rotate(-6deg) scale(1)}}

/* transición entre láminas */
.slide{transform:translateX(60px) scale(.96);filter:blur(6px);transition:opacity .55s,transform .55s cubic-bezier(.2,.8,.2,1),filter .55s,visibility .55s}
.slide.prev{transform:translateX(-60px) scale(.96)}
.slide.active{transform:none;filter:none}

/* título con brillo animado */
h1.t,h2.t{background:linear-gradient(100deg,#fff 0%,#fff 40%,#9ff0ff 50%,#fff 60%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 0 8px rgba(68,200,238,.85)) drop-shadow(0 0 22px rgba(68,200,238,.4))}
.active h2.t{animation:shine 3.5s ease-in-out infinite,titleIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes shine{0%{background-position:100% 0}60%,100%{background-position:-50% 0}}
@keyframes titleIn{from{opacity:0;transform:translateY(-24px) scale(.95);letter-spacing:6px}to{opacity:1;transform:none}}

/* entrada escalonada de bloques */
.active .concept>*, .active .twocol>*, .active .cards>*, .active .menu>*, .active .reto>*, .active .wheel-wrap>*, .active .video-frame{
  animation:popIn .65s cubic-bezier(.2,.9,.25,1.2) both}
.active .concept>*:nth-child(2),.active .twocol>*:nth-child(2),.active .cards>*:nth-child(2),.active .menu>*:nth-child(2),.active .reto>*:nth-child(2),.active .wheel-wrap>*:nth-child(2){animation-delay:.12s}
.active .concept>*:nth-child(3),.active .twocol>*:nth-child(3),.active .cards>*:nth-child(3),.active .menu>*:nth-child(3){animation-delay:.24s}
.active .cards>*:nth-child(4),.active .menu>*:nth-child(4){animation-delay:.36s}
.active .cards>*:nth-child(5),.active .menu>*:nth-child(5){animation-delay:.48s}
.active .menu>*:nth-child(6){animation-delay:.6s}.active .menu>*:nth-child(7){animation-delay:.72s}.active .menu>*:nth-child(8){animation-delay:.84s}
@keyframes popIn{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:none}}

/* borde animado tipo neón en las tarjetas */
.card{overflow:visible}
.card::after{content:"";position:absolute;inset:-2.5px;border-radius:inherit;padding:2.5px;pointer-events:none;
  background:conic-gradient(from var(--a,0deg),transparent 0 70%,#fff 80%,var(--c) 88%,transparent 95%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:orbit 5s linear infinite;opacity:.9}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes orbit{to{--a:360deg}}
.flip .card::after,.drawer::after{animation-duration:6s}

/* íconos que flotan y laten */
.active .icon{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px);box-shadow:0 0 26px var(--c),0 0 50px color-mix(in srgb,var(--c) 40%,transparent)}}

/* foto con zoom lento */
.photo{position:relative}
.active .photo img{animation:kenburns 14s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,-2%)}}
.photo::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent 55%,rgba(5,2,33,.55));border-radius:inherit}

/* hover más vivo */
.menu .card:hover,.twocol .card:hover,.concept .card:hover{box-shadow:0 0 22px var(--c),0 0 50px color-mix(in srgb,var(--c) 55%,transparent)}
.flip:hover{transform:translateY(-8px) scale(1.02)}
.opt:hover,.chip:hover,.ord:hover,.mi:hover,.mul:hover,.tfb:hover{box-shadow:0 0 18px var(--cyan)}

/* viñetas con brillo al entrar */
ul.neon li{transition:opacity .5s,transform .5s cubic-bezier(.2,.9,.25,1.2)}
ul.neon li{transform:translateX(-20px)}
.active ul.neon li{transform:none}

/* temporizador: latido en los últimos segundos */
.timer.low svg{animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:rotate(-90deg) scale(1.06)}}

/* barra inferior tipo cristal */
.nav{background:none}
.nav::before{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:6px;height:56px;width:min(560px,96vw);border-radius:16px;
  background:rgba(10,1,87,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(68,200,238,.35);z-index:-1}

/* portada: destellos */
.hero-t span:first-child{animation:flicker 6s infinite}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.55}}
.cover h1,.end-glow{animation:flicker 6s infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#stars,.aurora{display:none}.card::after{display:none}}
/* ---------- responsive ---------- */
@media (max-width:860px){
  .concept,.twocol,.wheel-wrap,.reto{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
  .menu{grid-template-columns:1fr}

}

  .cards{grid-template-columns:1fr}
  .flip{min-height:170px}
  .nav .lbl{display:none}
}

function coverWheel(){
  const n=6,R=190,step=60,cols=["#86E30F","#44C8EE","#F8C00B","#CC47E7","#2E9BFF","#5D00F8"];let g="";
  for(let i=0;i<n;i++){const a0=(i*step-90)*Math.PI/180,a1=((i+1)*step-90)*Math.PI/180;
    g+=`<path d="M200,200 L${200+R*Math.cos(a0)},${200+R*Math.sin(a0)} A${R},${R} 0 0 1 ${200+R*Math.cos(a1)},${200+R*Math.sin(a1)} Z" fill="${cols[i]}" stroke="#050221" stroke-width="5"/>`;
    const am=((i+.5)*step-90)*Math.PI/180;g+=`<text x="${200+R*.64*Math.cos(am)}" y="${200+R*.64*Math.sin(am)}" font-family="Exo 2,Arial" font-weight="900" font-size="34" fill="#050221" text-anchor="middle" dominant-baseline="middle">${i+1}</text>`}
  return `<div class="cw"><div class="cw-ring"></div><svg viewBox="0 0 400 400"><g class="cw-rot">${g}</g></svg>
    <button class="cw-hub" data-go="1">START<br>GAME</button></div>`;
}
function photo(k,c){return k&&IMAGES[k]?`<div class="photo" style="--c:${c}"><img src="${IMAGES[k]}" alt=""></div>`:""}
function timerHTML(sec){
  const r=52,c=2*Math.PI*r;
  return `<div class="timer" data-ring><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" stroke="rgba(234,79,64,.25)" stroke-width="11" fill="#050221"/>
    <circle class="arc" cx="60" cy="60" r="${r}" stroke="#EA4F40" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0"/></svg>
    <div class="num"><div><span data-num>${sec}</span><small>segundos</small></div></div></div>`;
}
const WCOL=["#86E30F","#44C8EE","#F8C00B","#CC47E7","#2E9BFF","#EA4F40","#5D00F8","#F8C00B"];
function wheelHTML(s){
  const n=s.segs.length,R=190,cx=200,cy=200,step=360/n;
  let g="";
  s.segs.forEach((sg,i)=>{
    const a0=(i*step-90)*Math.PI/180,a1=((i+1)*step-90)*Math.PI/180;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const am=((i+.5)*step-90), tx=cx+R*.66*Math.cos(am*Math.PI/180), ty=cy+R*.66*Math.sin(am*Math.PI/180);
    const fill=WCOL[i%WCOL.length], dark=["#5D00F8","#EA4F40"].includes(fill);
    g+=`<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 0 1 ${x1},${y1} Z" fill="${fill}" stroke="#050221" stroke-width="4"/>
        <text x="${tx}" y="${ty}" fill="${dark?"#fff":"#050221"}" font-family="Exo 2,Arial" font-weight="800" font-size="${n>6?13:15}"
          text-anchor="middle" dominant-baseline="middle" transform="rotate(${am+90} ${tx} ${ty})">${sg[0]}</text>`;
  });
  return `<div class="wheel"><div class="pointer"></div>
    <svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="197" fill="#050221" stroke="#44C8EE" stroke-width="4"/><g class="rot" id="${s.id}-rot">${g}</g></svg>
    <button class="hub" data-spin="${s.id}">GIRAR</button></div>`;
}

const deck=$("#deck");

const slides=[...deck.children];

function go(n){
  n=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((el,i)=>{el.classList.toggle("active",i===n);el.classList.toggle("prev",i<n)});
  cur=n;$("#count").textContent=`${n+1} / ${slides.length}`;
  $("#progress").style.width=((n)/(slides.length-1)*100)+"%";
  slides.forEach(el=>{clearInterval(timers.get(el))});
  if(SLIDES[n].type==="reto"){const el=slides[n];const qz=$(".quiz",el);
    if(!qz.classList.contains("done"))setTimeout(()=>{if(cur===n)startTimer(el,SLIDES[n].sec||20)},700);}
  if(SLIDES[n].type==="score")renderScore();
}
function updateNotes(){
  const s=SLIDES[cur];let txt=s.notes||"";
  if(s.type==="reto"){let sol="";if(s.kind==="mc")sol="ABCD"[s.c]+") "+s.o[s.c];
    if(s.kind==="tf")sol=s.items.map(x=>(x[1]?"V":"F")+" – "+x[0]).join("\n");
    if(s.kind==="classify")sol=s.items.map(x=>x[0]+" → "+s.buckets[x[1]]).join("\n");
    if(s.kind==="order")sol=s.items.map((x,k)=>(k+1)+". "+x).join("\n");
    if(s.kind==="match")sol=s.left.map((x,k)=>x+" → "+s.right[s.pairs[k]]).join("\n");
    if(s.kind==="multi")sol=s.items.filter(x=>x[1]).map(x=>"✓ "+x[0]).join("\n");
    txt=(txt?txt+"\n\n":"")+"Solución:\n"+sol+"\n\n"+s.e}
  $("#notes").innerHTML=`<h4>Notas del orador</h4>${txt?esc(txt).replace(/\n/g,"<br>"):"<i>Sin notas en esta lámina.</i>"}`;
}

let tt;function toast(m,bad){const t=$("#toast");t.textContent=m;t.style.background=bad?"var(--red)":"var(--green)";t.style.boxShadow=bad?"0 0 18px var(--red)":"0 0 18px var(--green)";t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600)}
let actx;function beep(f=880,d=.12){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.start();o.stop(actx.currentTime+d)}catch(e){}}


/* ================= RETOS INTERACTIVOS ================= */
function challengeHTML(s,i){
  const head=`<div class="q">${s.q}</div>`, ans=`<div class="answer" data-ans>${I("check")} ${s.e}</div>`;
  const wrap=(body)=>`<div class="quiz" data-kind="${s.kind}" data-si="${i}"${s.kind==="mc"?` data-c="${s.c}"`:""}>${head}${body}${ans}</div>`;
  switch(s.kind){
  case "mc": return wrap(`<div class="opts">${s.o.map((x,k)=>`<button class="opt" data-opt="${k}"><span class="L">${"ABCD"[k]}</span>${x}</button>`).join("")}</div>`);
  case "tf": return wrap(`<div class="tf">${s.items.map((x,k)=>`<div class="tf-row"><span>${x[0]}</span>
      <button class="tfb" data-tf="${k}" data-v="1">V</button><button class="tfb" data-tf="${k}" data-v="0">F</button></div>`).join("")}</div>`);
  case "classify": return wrap(`<div class="pool">${s.items.map((x,k)=>`<button class="chip" data-item="${k}">${x[0]}</button>`).join("")}</div>
      <div class="buckets">${s.buckets.map((b,k)=>`<button class="bucket b${k}" data-bucket="${k}"><b>${b}</b><div class="drop"></div></button>`).join("")}</div>`);
  case "order": return wrap(`<div class="order">${s.shuffle.map(k=>`<button class="ord" data-ord="${k}"><span class="num"></span>${s.items[k]}</button>`).join("")}</div>
      <div class="row"><button class="btn ghost small" data-ordreset>${I("rotate-ccw")} Borrar orden</button></div>`);
  case "match": return wrap(`<div class="match"><div class="mcol">${s.left.map((x,k)=>`<button class="mi" data-ml="${k}">${x}</button>`).join("")}</div>
      <div class="mcol">${s.right.map((x,k)=>`<button class="mi r" data-mr="${k}">${x}</button>`).join("")}</div></div>`);
  case "multi": return wrap(`<div class="multi">${s.items.map((x,k)=>`<button class="mul" data-mul="${k}"><span class="box2">${I("check")}</span>${x[0]}</button>`).join("")}</div>
      <div class="row"><button class="btn" data-mcheck style="--b:var(--gold)">${I("check")} Comprobar</button></div>`);
  }
}
const PCOL=["#CC47E7","#2E9BFF","#86E30F","#F8C00B"];
function finish(qz,good,total,auto){
  if(qz.classList.contains("done"))return;qz.classList.add("done");$("[data-ans]",qz).classList.add("show");
  const sl=qz.closest(".slide");if(sl)clearInterval(timers.get(sl));
  if(auto){toast("¡Se acabó el tiempo!",true);return}
  const perfect=good===total;beep(perfect?1200:400,.3);
  toast(total===1?(perfect?"¡Correcto!":"Incorrecto"):(perfect?`¡Excelente! ${good} de ${total}`:`${good} de ${total} correctas`),!perfect);
  if(perfect)confetti(qz);
}
function confetti(el){const r=el.getBoundingClientRect();for(let k=0;k<40;k++){const c=document.createElement("i");c.className="cf";
  c.style.left=(r.left+r.width/2)+"px";c.style.top=(r.top+r.height/3)+"px";c.style.background=PCOL[k%4];
  c.style.setProperty("--dx",(Math.random()*2-1)*280+"px");c.style.setProperty("--dy",(Math.random()*240+40)+"px");
  document.body.appendChild(c);setTimeout(()=>c.remove(),1300)}}
function spec(qz){return qz.dataset.si!==undefined?SLIDES[+qz.dataset.si]:{}}
function solve(qz){ // revela la solución cuando se acaba el tiempo
  if(!qz||qz.classList.contains("done"))return;const k=qz.dataset.kind,s=spec(qz);
  if(k==="mc"){const c=+qz.dataset.c;qz.querySelectorAll(".opt").forEach((b,i)=>b.classList.add(i===c?"ok":"off"))}
  if(k==="tf")qz.querySelectorAll(".tf-row").forEach((r,i)=>{if(r.dataset.ans!==undefined)return;r.querySelectorAll(".tfb").forEach(b=>b.classList.add(+b.dataset.v===s.items[i][1]?"ok":"off"))});
  if(k==="classify")qz.querySelectorAll(".chip").forEach(c=>{const it=s.items[+c.dataset.item];c.classList.remove("sel");$(`[data-bucket="${it[1]}"] .drop`,qz).appendChild(c);c.classList.add("ok")});
  if(k==="order")qz.querySelectorAll(".ord").forEach(b=>{$(".num",b).textContent=+b.dataset.ord+1;b.classList.add("picked","ok")});
  if(k==="match")qz.querySelectorAll("[data-ml]").forEach((b,i)=>{const r=$(`[data-mr="${s.pairs[i]}"]`,qz);[b,r].forEach(x=>{x.classList.remove("sel","bad");x.style.setProperty("--pc",PCOL[i]);x.classList.add("paired","ok")})});
  if(k==="multi")qz.querySelectorAll(".mul").forEach((b,i)=>{b.classList.toggle("on",!!s.items[i][1]);b.classList.add(s.items[i][1]?"ok":"off")});
  finish(qz,0,0,true);
}
const sel=new WeakMap();
function interact(t,slide){
  const qz=t.closest(".quiz");if(!qz||qz.classList.contains("done"))return !!qz;const s=spec(qz);
  if(t.dataset.opt!==undefined){const c=+qz.dataset.c,o=+t.dataset.opt;qz.querySelectorAll(".opt").forEach((b,i)=>b.classList.add(i===c?"ok":(i===o?"bad":"off")));
    finish(qz,o===c?1:0,1);return true}
  if(t.dataset.tf!==undefined){const row=t.closest(".tf-row");if(row.dataset.ans!==undefined)return true;const i=+t.dataset.tf,v=+t.dataset.v,ok=v===s.items[i][1];
    row.dataset.ans=ok?1:0;t.classList.add(ok?"ok":"bad");row.querySelectorAll(".tfb").forEach(b=>{if(b!==t)b.classList.add(ok?"off":"ok")});beep(ok?1000:250,.15);
    const rows=[...qz.querySelectorAll(".tf-row")];if(rows.every(r=>r.dataset.ans!==undefined))finish(qz,rows.filter(r=>r.dataset.ans==="1").length,rows.length);return true}
  if(t.dataset.item!==undefined){qz.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));t.classList.add("sel");sel.set(qz,t);beep(700,.04);return true}
  if(t.dataset.bucket!==undefined){const c=sel.get(qz);if(!c){toast("Primero toca una tarjeta",true);return true}
    $(".drop",t).appendChild(c);c.classList.remove("sel");c.dataset.placed=t.dataset.bucket;sel.delete(qz);beep(900,.05);
    const chips=[...qz.querySelectorAll(".chip")];if(chips.every(x=>x.dataset.placed!==undefined)){let g=0;chips.forEach(x=>{const ok=+x.dataset.placed===s.items[+x.dataset.item][1];if(ok)g++;x.classList.add(ok?"ok":"bad")});finish(qz,g,chips.length)}return true}
  if(t.dataset.ord!==undefined){if($(".num",t).textContent)return true;const n=qz.querySelectorAll(".ord.picked").length+1;$(".num",t).textContent=n;t.classList.add("picked");beep(600+n*120,.06);
    const all=[...qz.querySelectorAll(".ord")];if(all.every(b=>b.classList.contains("picked"))){let g=0;all.forEach(b=>{const ok=+$(".num",b).textContent===+b.dataset.ord+1;if(ok)g++;b.classList.add(ok?"ok":"bad")});finish(qz,g,all.length)}return true}
  if(t.hasAttribute("data-ordreset")){qz.querySelectorAll(".ord").forEach(b=>{$(".num",b).textContent="";b.classList.remove("picked")});return true}
  if(t.dataset.ml!==undefined){if(t.classList.contains("paired"))return true;qz.querySelectorAll("[data-ml]").forEach(b=>b.classList.remove("sel"));t.classList.add("sel");sel.set(qz,t);beep(700,.04);return true}
  if(t.dataset.mr!==undefined){const l=sel.get(qz);if(t.classList.contains("paired"))return true;if(!l){toast("Primero toca una situación",true);return true}
    const i=+l.dataset.ml,ok=s.pairs[i]===+t.dataset.mr,col=PCOL[qz.querySelectorAll("[data-ml].paired").length];
    [l,t].forEach(x=>{x.classList.remove("sel");x.classList.add("paired",ok?"ok":"bad");x.style.setProperty("--pc",col)});l.dataset.ok=ok?1:0;sel.delete(qz);beep(ok?1000:250,.15);
    const L=[...qz.querySelectorAll("[data-ml]")];if(L.every(x=>x.classList.contains("paired")))finish(qz,L.filter(x=>x.dataset.ok==="1").length,L.length);return true}
  if(t.dataset.mul!==undefined){t.classList.toggle("on");beep(650,.04);return true}
  if(t.hasAttribute("data-mcheck")){const b=[...qz.querySelectorAll(".mul")];let g=0;b.forEach((x,i)=>{const ok=x.classList.contains("on")===!!s.items[i][1];if(ok)g++;x.classList.add(ok?(s.items[i][1]?"ok":"off"):"bad")});finish(qz,g,b.length);return true}
  return false;
}
/* ---------- temporizador ---------- */
const timers=new WeakMap();
function timeUp(qz){solve(qz)}
function startTimer(slide,sec){
  const box=$(".chal-box",slide),q0=$(".quiz",slide);if(box&&q0&&q0.querySelector(".ok,.bad,.sel,.picked,.on,.paired"))box.innerHTML=challengeHTML(SLIDES[+slide.dataset.i],+slide.dataset.i);
  const ring=$("[data-ring]",slide),num=$("[data-num]",slide),arc=$(".arc",slide),C=2*Math.PI*52;
  clearInterval(timers.get(slide));ring.classList.remove("done");
  let left=sec;num.textContent=left;arc.style.transition="none";arc.style.strokeDashoffset=0;
  requestAnimationFrame(()=>{arc.style.transition=`stroke-dashoffset ${sec}s linear`;arc.style.strokeDashoffset=C});
  timers.set(slide,setInterval(()=>{left--;num.textContent=Math.max(0,left);beep(left<=3?1200:700,.06);ring.classList.toggle("low",left<=5&&left>0);
    if(left<=0){clearInterval(timers.get(slide));ring.classList.add("done");beep(300,.6);timeUp($(".quiz",slide))}},1000));
}

/* ---------- ruleta ---------- */
const rot={};
function spin(id){
  const s=SLIDES.find(x=>x.id===id),n=s.segs.length,step=360/n;
  const k=Math.floor(Math.random()*n);
  rot[id]=(rot[id]||0)+360*5+(360-((rot[id]||0)%360))-(k*step+step/2)+ (Math.random()-.5)*step*.6;
  const g=$(`#${id}-rot`);g.style.transform=`rotate(${rot[id]}deg)`;
  const res=$(`#${id}-res`);res.style.opacity=.4;
  let ticks=0;const iv=setInterval(()=>{beep(500+Math.random()*300,.03);if(++ticks>22)clearInterval(iv)},180);
  setTimeout(()=>{res.style.opacity=1;showResult(s,k)},4600);
}
function showResult(s,k){
  const res=$(`#${s.id}-res`),sg=s.segs[k];beep(1000,.25);
  if(s.type==="wheel"){res.innerHTML=`<h3 style="color:${WCOL[k]}">${sg[0]}</h3><p>${sg[1]}</p>
     <p style="margin-top:14px;color:var(--soft)">Gira otra vez para ver otra función.</p>`;return}
  const pts=sg[0].includes("BONUS")?20:10, sec=sg[0].includes("5s")?5:15;
  res.innerHTML=`<h3 style="color:${WCOL[k]}">${sg[0]}</h3>
    <div class="row" style="margin:0 0 10px"><button class="btn" data-timer-inline="${sec}">${I("timer")} <span class="sec">${sec}</span>s</button></div>
    ${quizHTML(sg[1],sg[2],sg[3],"Respuesta correcta: "+sg[2][sg[3]],pts)}`;
  const tb=$("[data-timer-inline]",res);inlineTimer(tb,sec);
}
let inlineIv;function inlineTimer(btn,sec){clearInterval(inlineIv);let l=sec;const sp=$(".sec",btn),qz=btn.closest(".result").querySelector(".quiz");btn.disabled=true;sp.textContent=l;
  inlineIv=setInterval(()=>{if(qz.classList.contains("done")){clearInterval(inlineIv);return}l--;sp.textContent=Math.max(0,l);beep(l<=3?1200:700,.06);if(l<=0){clearInterval(inlineIv);beep(300,.6);timeUp(qz)}},1000)}

/* ---------- eventos ---------- */
deck.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-sub],[data-jump],.flip");if(!t)return;const slide=t.closest(".slide");
  if(t.dataset.go)go(+t.dataset.go);
  if(t.dataset.sub)go(SLIDES.findIndex(s=>s.tag==="SUBTEMA "+t.dataset.sub));
  if(t.dataset.jump)go(SLIDES.findIndex(s=>s.type===t.dataset.jump));
  if(t.classList.contains("flip")){t.classList.toggle("on");beep(600,.05)}
  if(t.hasAttribute("data-flipall")){const fl=slide.querySelectorAll(".flip"),all=[...fl].every(f=>f.classList.contains("on"));fl.forEach(f=>f.classList.toggle("on",!all))}
  if(t.closest(".quiz")&&interact(t,slide))return;
  if(t.dataset.timer)startTimer(slide,+t.dataset.timer);
  if(t.dataset.timerInline)inlineTimer(t,+t.dataset.timerInline);
  if(t.hasAttribute("data-show")){$("[data-ans]",t.closest(".card")).classList.add("show");beep(1000,.2)}
  if(t.dataset.award!==undefined)addPts(+t.dataset.award,+t.dataset.pts);
  if(t.dataset.spin)spin(t.dataset.spin);
  if(t.hasAttribute("data-reset")){if(confirmReset()){teams.forEach(x=>x.p=0);saveTeams();$("#winnerBox").innerHTML=""}}
  if(t.hasAttribute("data-winner")){const w=[...teams].sort((a,b)=>b.p-a.p)[0];
    $("#winnerBox").innerHTML=`<div class="winner">${I("trophy")}</div><div class="winner-name">${esc(w.n)} · ${w.p} pts</div>`;beep(880,.15);setTimeout(()=>beep(1320,.3),160)}
});
let resetArm=0;function confirmReset(){if(Date.now()-resetArm<2500)return true;resetArm=Date.now();toast("Toca otra vez para reiniciar");return false}

$("#bPrev").onclick=()=>go(cur-1);$("#bNext").onclick=()=>go(cur+1);$("#bMenu").onclick=()=>go(1);

$("#bPdf").onclick=()=>{toast("Elige «Guardar como PDF» en la ventana de impresión");setTimeout(()=>{try{window.print()}catch(e){}},600)};
$("#bFull").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(["ArrowRight","PageDown"].includes(e.key))go(cur+1);
  if(["ArrowLeft","PageUp"].includes(e.key))go(cur-1);
  if(e.key==="Home")go(0);if(e.key==="End")go(slides.length-1);
  if(e.key.toLowerCase()==="f")$("#bFull").click();
});
let tx0=null,ty0=null;
deck.addEventListener("touchstart",e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY},{passive:true});
deck.addEventListener("touchend",e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));tx0=null},{passive:true});

document.querySelectorAll("[data-i]").forEach(b=>b.insertAdjacentHTML("afterbegin",I(b.dataset.i)));

/* ---------- fondo de estrellas ---------- */
(function(){const c=document.getElementById("stars");if(!c)return;const x=c.getContext("2d");let W,H,P=[];
  const cols=["#44C8EE","#CC47E7","#F8C00B","#ffffff","#86E30F"];
  function rs(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;
    P=Array.from({length:Math.min(140,Math.floor(innerWidth/9))},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.6+.4)*devicePixelRatio,
      v:(Math.random()*.25+.05)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)],t:Math.random()*6.28}))}
  addEventListener("resize",rs);rs();
  (function f(){x.clearRect(0,0,W,H);for(const p of P){p.y-=p.v;p.t+=.03;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
    x.globalAlpha=.35+.35*Math.sin(p.t);x.fillStyle=p.c;x.shadowColor=p.c;x.shadowBlur=8*devicePixelRatio;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    requestAnimationFrame(f)})();
})();
go(0);
</script>
